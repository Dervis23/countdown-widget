name: Android APK Derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android SDK paketlerini yükle
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "cmdline-tools;latest" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Debug APK derle
        run: ./gradlew clean :app:assembleDebug --no-daemon

      - name: APK'yı yükle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: geri-sayim-apk
          path: app/build/outputs/apk/debug/app-debug.apk
