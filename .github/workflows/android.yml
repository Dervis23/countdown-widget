name: Android APK Derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK Lisanslarını Kabul Et
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          cd $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager --licenses || true

      - name: Android SDK Paketlerini Yükle
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Debug APK Derle
        run: ./gradlew clean :app:assembleDebug --no-daemon

      - name: APK'yı Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: geri-sayim-apk
          path: app/build/outputs/apk/debug/app-debug.apk
